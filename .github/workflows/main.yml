name: Bootstrap Cloudflare resources

# One-time (re-runnable/idempotent) setup: creates the D1 database and R2
# bucket this app needs in your Cloudflare account, then commits the real D1
# database id into deploy/cf-resources.json so the Deploy workflow can bind
# to it. Run this manually from the Actions tab once, before the first real
# deploy. Safe to re-run later - it reuses existing resources instead of
# duplicating them.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions):
#   CLOUDFLARE_API_TOKEN   - a token with Workers Scripts:Edit, D1:Edit,
#                            Workers R2 Storage:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Read current resource names
        id: current
        run: |
          node -e "
            const c = require('./deploy/cf-resources.json');
            console.log('db_name=' + c.d1DatabaseName);
            console.log('bucket_name=' + c.r2BucketName);
          " >> "$GITHUB_OUTPUT"

      - name: Create or find D1 database
        id: d1
        env:
          DB_NAME: ${{ steps.current.outputs.db_name }}
        run: |
          set -e
          echo "Looking for an existing D1 database named $DB_NAME..."
          EXISTING_ID=$(npx wrangler d1 list --json 2>/tmp/d1_list.log | node -e "
            let data = '';
            process.stdin.on('data', (d) => (data += d));
            process.stdin.on('end', () => {
              try {
                const list = JSON.parse(data);
                const match = Array.isArray(list) ? list.find((db) => db.name === process.env.DB_NAME) : null;
                console.log(match ? (match.uuid || match.id || '') : '');
              } catch (e) {
                console.log('');
              }
            });
          ") || true
          cat /tmp/d1_list.log || true

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "undefined" ]; then
            echo "Found existing database: $EXISTING_ID"
            echo "database_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Creating new D1 database: $DB_NAME"
            CREATE_OUTPUT=$(npx wrangler d1 create "$DB_NAME" --json 2>&1) || {
              echo "$CREATE_OUTPUT"
              if echo "$CREATE_OUTPUT" | grep -qi "already exists"; then
                echo "Database already exists but wasn't found by list - trying wrangler d1 info instead."
                INFO_OUTPUT=$(npx wrangler d1 info "$DB_NAME" --json 2>&1)
                echo "$INFO_OUTPUT"
                NEW_ID=$(echo "$INFO_OUTPUT" | node -e "
                  let data = '';
                  process.stdin.on('data', (d) => (data += d));
                  process.stdin.on('end', () => {
                    try { const p = JSON.parse(data); console.log(p.uuid || p.database_id || p.id || ''); } catch (e) { console.log(''); }
                  });
                ")
                if [ -z "$NEW_ID" ]; then
                  echo "::error::Could not determine the D1 database id from 'wrangler d1 info'. Check the log above and set d1DatabaseId in deploy/cf-resources.json by hand."
                  exit 1
                fi
                echo "database_id=$NEW_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::wrangler d1 create failed - see log above."
              exit 1
            }
            echo "$CREATE_OUTPUT"
            NEW_ID=$(echo "$CREATE_OUTPUT" | node -e "
              let data = '';
              process.stdin.on('data', (d) => (data += d));
              process.stdin.on('end', () => {
                try {
                  const parsed = JSON.parse(data);
                  console.log(parsed.uuid || parsed.database_id || parsed.id || '');
                } catch (e) {
                  console.log('');
                }
              });
            ")
            if [ -z "$NEW_ID" ]; then
              echo "::error::Could not parse the D1 database id out of 'wrangler d1 create' output. Check the log above (printed just before this step failed) and set d1DatabaseId in deploy/cf-resources.json by hand, then re-run Deploy."
              exit 1
            fi
            echo "Created database: $NEW_ID"
            echo "database_id=$NEW_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Create R2 bucket (idempotent)
        env:
          BUCKET_NAME: ${{ steps.current.outputs.bucket_name }}
        run: |
          echo "Ensuring R2 bucket $BUCKET_NAME exists..."
          if npx wrangler r2 bucket create "$BUCKET_NAME" 2>&1 | tee /tmp/r2_create.log; then
            echo "Bucket ready."
          else
            if grep -qi "already exists" /tmp/r2_create.log; then
              echo "Bucket already exists, continuing."
            else
              echo "::error::Failed to create R2 bucket - see log above."
              exit 1
            fi
          fi

      - name: Record the D1 database id
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node -e "
            const fs = require('fs');
            const path = './deploy/cf-resources.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.d1DatabaseId = process.env.DATABASE_ID;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "
          cat deploy/cf-resources.json

      - name: Commit updated resource config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/cf-resources.json
          if git diff --cached --quiet; then
            echo "No changes to commit - resource config already up to date."
          else
            git commit -m "chore: record Cloudflare D1 database id [skip ci]"
            git push
          fi
